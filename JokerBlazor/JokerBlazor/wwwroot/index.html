<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Joker's Manor, a Blazor WebAssembly joke browser by David Aydin. It runs in the browser and is hosted on GitHub Pages." />
    <meta name="theme-color" content="#312E81" />
    <title>Joker's Manor</title>
    <script>
        (function () {
            try {
                var mode = localStorage.getItem("joker-theme");
                var dark = mode === "dark" || (!mode && window.matchMedia("(prefers-color-scheme: dark)").matches);
                if (dark) {
                    document.documentElement.setAttribute("data-theme", "dark");
                    var theme = document.querySelector('meta[name="theme-color"]');
                    if (theme) theme.setAttribute("content", "#12121A");
                }
            } catch (e) { }
        })();
    </script>
    <!-- The Pages workflow rewrites this to /JokerBlazor/. Leave the root value so `dotnet run` works locally. -->
    <base href="/" />
    <script src="js/theme.js"></script>
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // https://github.com/rafrex/spa-github-pages
        // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
        (function (l) {
            if (l.search) {
                var q = {};
                l.search.slice(1).split('&').forEach(function (v) {
                    var a = v.split('=');
                    q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
                });
                if (q.p !== undefined) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, -1) + (q.p || '') +
                        (q.q ? ('?' + q.q) : '') +
                        l.hash
                    );
                }
            }
        }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,560&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link href="JokerBlazor.styles.css" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Joker's Manor hit an error while starting.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/confetti.browser.js"></script>
    <script src="js/joker.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>
</body>

</html>
